# Codemagic: проверка iOS-сборки каркаса (остаток FL-01-16).
#
# Файл должен лежать в корне репозитория и попасть в удалённый Git —
# без коммита/push Codemagic его не увидит.
# Workflow: debug .app для iPhoneSimulator (без магазинной подписи).
# Артефакт Runner.app → Quick Launch / App Preview (только для команд Codemagic).
# Публичные --dart-define = test из docs/environments.md; секреты сюда не класть.
# Источники: docs.codemagic.io/yaml-distributing/app-preview/,
#           docs.codemagic.io/flutter-configuration/flutter-projects/

workflows:
  ios-store-iphone-medium:
    name: iOS 72 clean required iPhone screenshots (no rebuild)
    max_build_duration: 25
    instance_type: mac_mini_m2
    environment:
      xcode: "26.6"
      groups:
        - app_store_connect_release
    scripts:
      - name: Capture required medium iPhone screenshots
        script: |
          set +x
          set -eu
          python3 tools/check_ios_simulator.py --store-screenshots --iphone-medium
    artifacts:
      - build/release/ios-store-screenshots/**

  ios-store-screenshots:
    name: iOS 72 clean App Store screenshots (no rebuild)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: "26.6"
      groups:
        - app_store_connect_release
    scripts:
      - name: Capture genuine screens without debug banner
        script: |
          set +x
          set -eu
          python3 tools/check_ios_simulator.py --store-screenshots
    artifacts:
      - build/release/ios-store-screenshots/**

  ios-simulator-navigation:
    name: iOS 72 menu navigation and iPad rotations (no rebuild)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      xcode: "26.6"
      groups:
        - app_store_connect_release
    scripts:
      - name: Check anonymous UI on verified simulator 72
        script: |
          set +x
          set -eu
          python3 tools/check_ios_simulator.py --navigation
    artifacts:
      - build/release/ios-simulator-navigation/**

  ios-simulator-smoke:
    name: iOS 72 simulator launch screenshots (no rebuild)
    max_build_duration: 20
    instance_type: mac_mini_m2
    environment:
      xcode: "26.6"
      groups:
        - app_store_connect_release
    scripts:
      - name: Launch verified simulator 72 on iPhone and iPad
        script: |
          set +x
          set -eu
          python3 tools/check_ios_simulator.py
    artifacts:
      - build/release/ios-simulator-smoke/*.json
      - build/release/ios-simulator-smoke/*.png
      - build/release/ios-simulator-smoke/*.txt

  ios-simulator-acceptance:
    name: iOS 72 simulator for manual acceptance (no store upload)
    max_build_duration: 45
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
      xcode: "26.6"
    scripts:
      - name: Build simulator app from accepted iOS 72 sources
        script: |
          set +x
          set -eu
          python3 tools/prepare_ios_simulator.py
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - build/release/ios-simulator/*.zip
      - build/release/ios-simulator/*.json

  ios-existing-ipa-upload:
    name: Existing verified IPA upload or status (no rebuild)
    max_build_duration: 20
    instance_type: mac_mini_m2
    inputs:
      action:
        description: status checks API; validate checks IPA with Apple; upload sends build
        type: choice
        default: status
        options:
          - status
          - validate
          - upload
    environment:
      xcode: "26.6"
      groups:
        - app_store_connect_release
    scripts:
      - name: Install pinned Codemagic upload tools
        script: |
          set +x
          set -eu
          python3 -m venv "$CM_BUILD_DIR/build/ios-upload-tools"
          "$CM_BUILD_DIR/build/ios-upload-tools/bin/python" -m pip install --disable-pip-version-check "codemagic-cli-tools==0.69.0"
      - name: Verify existing artifact and upload or check Apple status
        script: |
          set +x
          set -eu
          export PATH="$CM_BUILD_DIR/build/ios-upload-tools/bin:$PATH"
          python tools/upload_existing_ios.py --action "${{ inputs.action }}"
    artifacts:
      - build/release/ios-upload/*.json

  ios-release-prepare:
    name: iOS signed IPA (no store upload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    inputs:
      accepted_commit:
        description: Full Git SHA matching the selected checkout
        type: string
      release_notes:
        description: What is new (report only)
        type: string
    environment:
      flutter: 3.47.1
      xcode: "26.6"
      groups:
        - ios_release_signing
      vars:
        RELEASE_COMMIT: ${{ inputs.accepted_commit }}
        RELEASE_NOTES: ${{ inputs.release_notes }}
    scripts:
      - name: Prepare and verify IPA without App Store access
        script: |
          set +x
          python3 tools/prepare_ios_ci.py
    artifacts:
      - build/release/ios/*.ipa
      - build/release/ios/*.json
      - build/release/ios/*.txt

  android-release-prepare:
    name: Android signed artifacts (no store upload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    inputs:
      accepted_commit:
        description: Full Git SHA to prepare (must match selected branch or commit)
        type: string
      stores:
        description: Android artifacts to prepare
        type: choice
        default: google_play,rustore
        options:
          - google_play,rustore
          - google_play
          - rustore
      release_notes:
        description: What is new (saved in report only)
        type: string
      mode:
        description: Preparation only; store submission is not implemented here
        type: choice
        default: prepare
        options:
          - prepare
    environment:
      flutter: 3.47.1
      java: 17
      xcode: "26.6"
      groups:
        - android_release_signing
      vars:
        RELEASE_COMMIT: ${{ inputs.accepted_commit }}
        RELEASE_STORES: ${{ inputs.stores }}
        RELEASE_NOTES: ${{ inputs.release_notes }}
        RELEASE_MODE: ${{ inputs.mode }}
    scripts:
      - name: Prepare and verify Android artifacts without store access
        script: |
          set +x
          python3 tools/prepare_android_ci.py
    artifacts:
      - build/release/android/*.aab
      - build/release/android/*.apk
      - build/release/android/*.json
      - build/release/android/*.txt

  google-play-api-check:
    name: Google Play API access check (no release)
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play_release
    scripts:
      - name: Check Google Play access to existing build 71
        script: |
          set +x
          python3 tools/check_google_play_access.py
    artifacts:
      - build/release-check/google-play-access.json

  ios-simulator-test:
    name: iOS Simulator (test)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
      xcode: latest
      cocoapods: default
      vars:
        APP_ENV: test
        API_BASE_URL: https://hleb-sol.su/Zakaz_http/hs/Obmen/
        DATA_BASE_URL: https://flutter-test.obedmoscow.ru/data/
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get --enforce-lockfile
      - name: Analyze
        script: |
          flutter analyze --no-pub
      - name: Unit and widget tests
        script: |
          flutter test --no-pub -r compact
      - name: Build iOS debug for simulator
        script: |
          flutter build ios --debug --simulator --no-pub \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=DATA_BASE_URL="$DATA_BASE_URL"
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log
