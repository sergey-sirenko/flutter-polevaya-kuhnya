# Codemagic: проверка iOS-сборки каркаса (остаток FL-01-16).
#
# Файл должен лежать в корне репозитория и попасть в удалённый Git —
# без коммита/push Codemagic его не увидит.
# Workflow: debug .app для iPhoneSimulator (без магазинной подписи).
# Артефакт Runner.app → Quick Launch / App Preview (только для команд Codemagic).
# Публичные --dart-define = test из docs/environments.md; секреты сюда не класть.
# Источники: docs.codemagic.io/yaml-distributing/app-preview/,
#           docs.codemagic.io/flutter-configuration/flutter-projects/

workflows:
  ios-release-prepare:
    name: iOS signed IPA (no store upload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    inputs:
      accepted_commit:
        description: Full Git SHA matching the selected checkout
        type: string
      release_notes:
        description: What is new (report only)
        type: string
    environment:
      flutter: 3.47.1
      xcode: "26.6"
      groups:
        - ios_release_signing
      vars:
        RELEASE_COMMIT: ${{ inputs.accepted_commit }}
        RELEASE_NOTES: ${{ inputs.release_notes }}
    scripts:
      - name: Prepare and verify IPA without App Store access
        script: |
          set +x
          python3 tools/prepare_ios_ci.py
    artifacts:
      - build/release/ios/*.ipa
      - build/release/ios/*.json
      - build/release/ios/*.txt

  android-release-prepare:
    name: Android signed artifacts (no store upload)
    max_build_duration: 60
    instance_type: mac_mini_m2
    inputs:
      accepted_commit:
        description: Full Git SHA to prepare (must match selected branch or commit)
        type: string
      stores:
        description: Android artifacts to prepare
        type: choice
        default: google_play,rustore
        options:
          - google_play,rustore
          - google_play
          - rustore
      release_notes:
        description: What is new (saved in report only)
        type: string
      mode:
        description: Preparation only; store submission is not implemented here
        type: choice
        default: prepare
        options:
          - prepare
    environment:
      flutter: 3.47.1
      java: 17
      xcode: "26.6"
      groups:
        - android_release_signing
      vars:
        RELEASE_COMMIT: ${{ inputs.accepted_commit }}
        RELEASE_STORES: ${{ inputs.stores }}
        RELEASE_NOTES: ${{ inputs.release_notes }}
        RELEASE_MODE: ${{ inputs.mode }}
    scripts:
      - name: Prepare and verify Android artifacts without store access
        script: |
          set +x
          python3 tools/prepare_android_ci.py
    artifacts:
      - build/release/android/*.aab
      - build/release/android/*.apk
      - build/release/android/*.json
      - build/release/android/*.txt

  google-play-api-check:
    name: Google Play API access check (no release)
    max_build_duration: 15
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_play_release
    scripts:
      - name: Check Google Play access to existing build 71
        script: |
          set +x
          python3 tools/check_google_play_access.py
    artifacts:
      - build/release-check/google-play-access.json

  ios-simulator-test:
    name: iOS Simulator (test)
    max_build_duration: 60
    instance_type: mac_mini_m2
    environment:
      flutter: 3.47.1
      xcode: latest
      cocoapods: default
      vars:
        APP_ENV: test
        API_BASE_URL: https://hleb-sol.su/Zakaz_http/hs/Obmen/
        DATA_BASE_URL: https://flutter-test.obedmoscow.ru/data/
    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get --enforce-lockfile
      - name: Analyze
        script: |
          flutter analyze --no-pub
      - name: Unit and widget tests
        script: |
          flutter test --no-pub -r compact
      - name: Build iOS debug for simulator
        script: |
          flutter build ios --debug --simulator --no-pub \
            --dart-define=APP_ENV="$APP_ENV" \
            --dart-define=API_BASE_URL="$API_BASE_URL" \
            --dart-define=DATA_BASE_URL="$DATA_BASE_URL"
    artifacts:
      - build/ios/iphonesimulator/Runner.app
      - /tmp/xcodebuild_logs/*.log
