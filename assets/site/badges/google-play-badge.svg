<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" width="180" height="60" role="img" aria-label="Доступно в Google Play">
  <defs>
    <linearGradient id="gp-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e1e1e"/>
      <stop offset="100%" style="stop-color:#000000"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="180" height="60" rx="10" ry="10" fill="url(#gp-bg)"/>
  <rect width="178" height="58" rx="9.5" ry="9.5" x="1" y="1" fill="none" stroke="#555" stroke-width="0.8"/>

  <!-- Google Play triangle icon (colorful) -->
  <g transform="translate(14, 12)">
    <!-- Shadow/bottom layer -->
    <path d="M2 34 L20 18.5 L14 13 z" fill="#00796B" opacity="0.8"/>
    <!-- Red (top right) -->
    <path d="M20 18.5 L30 12 L24 8 L2 0 z" fill="#EA4335"/>
    <!-- Green (left) -->
    <path d="M2 0 L2 34 L20 18.5 z" fill="#4CAF50"/>
    <!-- Blue (bottom right) -->
    <path d="M20 18.5 L2 34 L24 29 L30 25.5 z" fill="#2196F3"/>
    <!-- Yellow (top) -->
    <path d="M30 12 L30 25.5 L20 18.5 z" fill="#FFCA28"/>
  </g>

  <!-- Text: Доступно в -->
  <text x="52" y="22" font-family="'Google Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="white" font-weight="300" letter-spacing="0.2">Доступно в</text>

  <!-- Text: Google Play -->
  <text x="51" y="42" font-family="'Google Sans', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="white" font-weight="500" letter-spacing="-0.2">Google Play</text>
</svg>
