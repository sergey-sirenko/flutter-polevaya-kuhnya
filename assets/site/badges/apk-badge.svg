<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" width="180" height="60" role="img" aria-label="Скачать Android-приложение с нашего сайта">
  <defs>
    <linearGradient id="apk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3DDC84"/>
      <stop offset="100%" style="stop-color:#1B8A4A"/>
    </linearGradient>
  </defs>

  <!-- Background (Android green) -->
  <rect width="180" height="60" rx="10" ry="10" fill="url(#apk-bg)"/>

  <!-- Android robot logo -->
  <g transform="translate(13, 10)">
    <rect x="0" y="0" width="38" height="38" rx="8" ry="8" fill="white" opacity="0.15"/>

    <!-- Head -->
    <rect x="10" y="10" width="18" height="12" rx="4" ry="4" fill="white"/>

    <!-- Antennae -->
    <line x1="14" y1="10" x2="11" y2="5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="24" y1="10" x2="27" y2="5" stroke="white" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Eyes -->
    <circle cx="15" cy="15" r="1.8" fill="#1B8A4A"/>
    <circle cx="23" cy="15" r="1.8" fill="#1B8A4A"/>

    <!-- Body -->
    <rect x="7" y="23" width="24" height="12" rx="3" ry="3" fill="white"/>

    <!-- Arms -->
    <rect x="2" y="24" width="4" height="8" rx="2" ry="2" fill="white"/>
    <rect x="32" y="24" width="4" height="8" rx="2" ry="2" fill="white"/>

    <!-- Legs -->
    <rect x="11" y="35" width="5" height="4" rx="2" ry="2" fill="white"/>
    <rect x="22" y="35" width="5" height="4" rx="2" ry="2" fill="white"/>
  </g>

  <!-- Text: Скачать -->
  <text x="58" y="22" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="white" font-weight="300" opacity="0.9" letter-spacing="0.2">Скачать</text>

  <!-- Text: с нашего сайта -->
  <text x="57" y="42" font-family="'Roboto', 'Helvetica Neue', Arial, sans-serif" font-size="13" fill="white" font-weight="700" letter-spacing="-0.2">с нашего сайта</text>
</svg>
