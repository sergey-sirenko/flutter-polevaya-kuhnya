<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 60" width="180" height="60" role="img" aria-label="Скачать в RuStore">
  <defs>
    <linearGradient id="rs-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0A2FFF"/>
      <stop offset="100%" style="stop-color:#0019CC"/>
    </linearGradient>
    <linearGradient id="rs-icon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffffff;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#d0d8ff;stop-opacity:1"/>
    </linearGradient>
  </defs>

  <!-- Background (синий фирменный RuStore) -->
  <rect width="180" height="60" rx="10" ry="10" fill="url(#rs-bg)"/>

  <!-- RuStore logo icon (стилизованная «R» + store полка) -->
  <g transform="translate(13, 10)">
    <!-- Иконка: квадрат с закруглёнными углами -->
    <rect x="0" y="0" width="38" height="38" rx="8" ry="8" fill="white" opacity="0.15"/>

    <!-- Буква R стилизованная -->
    <rect x="9" y="8" width="5" height="22" rx="2" fill="white"/>
    <!-- Дуга R -->
    <path d="M14 8 Q26 8 26 16 Q26 22 14 22" fill="none" stroke="white" stroke-width="5" stroke-linecap="round"/>
    <!-- Нога R -->
    <line x1="16" y1="22" x2="27" y2="30" stroke="white" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Текст: Скачать в -->
  <text x="60" y="22" font-family="'VK Sans Display', 'Helvetica Neue', Arial, sans-serif" font-size="10" fill="white" font-weight="300" opacity="0.9" letter-spacing="0.2">Скачать в</text>

  <!-- Текст: RuStore -->
  <text x="59" y="43" font-family="'VK Sans Display', 'Helvetica Neue', Arial, sans-serif" font-size="22" fill="white" font-weight="700" letter-spacing="-0.3">RuStore</text>
</svg>
